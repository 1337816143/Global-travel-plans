name: Commit Global lockfile once

on:
  push:
    branches:
      - refactor/global-core-phase-1
    paths:
      - '.github/workflows/commit-global-lockfile-once.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-core-phase-1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(global): commit reproducible npm lockfile"
          git push origin HEAD:refactor/global-core-phase-1
