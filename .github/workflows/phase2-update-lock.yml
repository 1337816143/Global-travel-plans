name: Phase 2 update workspace lockfile

on:
  push:
    branches:
      - feature/content-rich-global-planner
    paths:
      - 'packages/content-model/package.json'
      - '.github/workflows/phase2-update-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-rich-global-planner
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(content): update workspace lockfile'
          git push origin HEAD:feature/content-rich-global-planner
