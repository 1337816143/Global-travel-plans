name: Patch stationary planner legs once

on:
  push:
    branches:
      - refactor/global-core-phase-1
    paths:
      - '.github/workflows/patch-planner-zero-leg-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-core-phase-1
          fetch-depth: 1
      - name: Patch stationary same-place legs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/planner/src/index.ts')
          text = path.read_text('utf-8')
          old = "    const durationMinutes = matrixEntry?.durationMinutes ?? (origin.placeId === destination.placeId ? 10 : 60);"
          new = """    const stationarySamePlace =
              origin.placeId === destination.placeId &&
              !origin.poiId &&
              !destination.poiId &&
              origin.kind !== 'transfer' &&
              destination.kind !== 'transfer';
            const durationMinutes =
              matrixEntry?.durationMinutes ??
              (stationarySamePlace ? 0 : origin.placeId === destination.placeId ? 10 : 60);"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one planner duration expression, found {text.count(old)}')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --silent
      - run: npx prettier --write packages/planner/src/index.ts
      - name: Commit focused planner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/planner/src/index.ts
          git commit -m "fix(planner): avoid travel time for stationary activities"
          git push origin HEAD:refactor/global-core-phase-1
