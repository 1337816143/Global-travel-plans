name: Diagnose Global lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Capture ESLint output
        run: |
          set +e
          npm run lint > lint-diagnostic.txt 2>&1
          cat lint-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: global-lint-diagnostic
          path: lint-diagnostic.txt
          if-no-files-found: error
          retention-days: 7
