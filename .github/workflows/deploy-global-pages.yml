name: Deploy Global Travel Plans to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'scripts/global/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.global.json'
      - 'apps/web/vite.config.ts'
      - '.github/workflows/deploy-global-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Build Global Travel Plans
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Report Pages result
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          page_url="${PAGE_URL:-not available}"
          cat > /tmp/pages-result.md <<EOF
          ## GitHub Pages deployment receipt

          - Commit: \`${GITHUB_SHA}\`
          - Build: \`${BUILD_RESULT}\`
          - Deploy: \`${DEPLOY_RESULT}\`
          - Page URL: ${page_url}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pages-result.md
