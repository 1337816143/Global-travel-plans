name: Global core strict quality gate

on:
  push:
    branches:
      - refactor/global-core-phase-1
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'scripts/global/**'
      - 'tests/global/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.global.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'playwright.global.config.ts'
      - '.github/workflows/global-core-ci-strict.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'fixtures/**'
      - 'scripts/global/**'
      - 'tests/global/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.global.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'playwright.global.config.ts'
      - '.github/workflows/global-core-ci-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare evidence directory
        run: mkdir -p global-ci-evidence

      - name: Install workspace dependencies
        run: |
          set -o pipefail
          npm install --ignore-scripts --silent 2>&1 | tee global-ci-evidence/install.log

      - name: Check formatting
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee global-ci-evidence/format.log

      - name: Lint global code
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee global-ci-evidence/lint.log

      - name: Typecheck strict TypeScript
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee global-ci-evidence/typecheck.log

      - name: Validate and export schemas
        run: |
          set -o pipefail
          npm run schema:validate 2>&1 | tee global-ci-evidence/schema-validation.log
          npm run schema:export 2>&1 | tee global-ci-evidence/schema-export.log

      - name: Run domain, schema and map unit tests
        run: |
          set -o pipefail
          npx vitest run packages/domain packages/data-schema packages/map-adapters --config vitest.config.ts 2>&1 | tee global-ci-evidence/unit.log

      - name: Run planner invariant and property tests
        run: |
          set -o pipefail
          npm run test:planner 2>&1 | tee global-ci-evidence/planner.log

      - name: Run provider contract tests
        run: |
          set -o pipefail
          npm run test:providers 2>&1 | tee global-ci-evidence/providers.log

      - name: Build the Global Web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee global-ci-evidence/build.log

      - name: Enforce bundle budget
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee global-ci-evidence/bundle.log
          from pathlib import Path
          import gzip, json
          root = Path('apps/web/dist/assets')
          files = [path for path in root.rglob('*') if path.is_file()]
          def compressed(paths):
              return sum(len(gzip.compress(path.read_bytes(), compresslevel=9, mtime=0)) for path in paths)
          js = compressed([path for path in files if path.suffix == '.js'])
          css = compressed([path for path in files if path.suffix == '.css'])
          total = js + css
          report = {'jsGzipBytes': js, 'cssGzipBytes': css, 'totalGzipBytes': total, 'budgets': {'js': 184320, 'css': 35840, 'total': 256000}}
          print(json.dumps(report, indent=2))
          if not files:
              raise SystemExit('No built assets found')
          if js > 184320 or css > 35840 or total > 256000:
              raise SystemExit('Bundle budget exceeded')
          PY

      - name: Scan new global code for secrets
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee global-ci-evidence/secret-scan.log
          from pathlib import Path
          import re
          roots = [Path('apps'), Path('packages'), Path('fixtures'), Path('scripts/global'), Path('tests/global')]
          files = [Path('.env.example'), Path('package.json'), Path('eslint.config.js'), Path('playwright.global.config.ts'), Path('vitest.config.ts')]
          for root in roots:
              files.extend(path for path in root.rglob('*') if path.is_file())
          patterns = {
              'private-key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'github-token': re.compile(r'(?:ghp|github_pat)_[A-Za-z0-9_]{20,}'),
              'aws-key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'openai-key': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
              'nvidia-key': re.compile(r'\bnvapi-[A-Za-z0-9_-]{20,}\b'),
              'amap-literal': re.compile(r'(?:AMAP|amap).{0,30}(?:key|code).{0,10}[=:]\s*["\'][A-Za-z0-9_-]{12,}["\']', re.I),
          }
          findings = []
          for path in files:
              try:
                  text = path.read_text('utf-8')
              except Exception:
                  continue
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      findings.append(f'{path}:{name}:{match.start()}')
          if findings:
              print('\n'.join(findings))
              raise SystemExit('Potential secrets found in Global Core')
          print(f'Secret scan passed for {len(files)} files; legacy credential risk is explicitly deferred by repository owner.')
          PY

      - name: Verify build did not modify tracked source
        run: |
          set -o pipefail
          git status --short --untracked-files=no | tee global-ci-evidence/tracked-status.log
          test -z "$(git status --short --untracked-files=no)"

      - name: Install Playwright browsers
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium webkit 2>&1 | tee global-ci-evidence/playwright-install.log

      - name: Run E2E and Pages base-path smoke tests
        run: |
          set -o pipefail
          npm run test:e2e:global 2>&1 | tee global-ci-evidence/e2e.log

      - name: Upload verified build and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-core-strict-artifacts
          path: |
            global-ci-evidence
            package-lock.json
            apps/web/dist
            .generated/json-schema
            playwright-report-global
            test-results-global
          if-no-files-found: warn
          retention-days: 30
